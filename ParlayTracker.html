<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NBA Parlay Tracker</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#6b7380;--bd:#e3e6eb;--ok:#12a150;--bad:#d93a3a;--live:#e08a00;--acc:#3b6df0;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c24;--tx:#eef0f4;--mut:#8b94a3;--bd:#272c37;--ok:#2fd27a;--bad:#ff5c5c;--live:#ffb020;--acc:#6b93ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:780px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:22px;margin:0 0 4px}button,select,input{font:inherit;color:inherit}
button,select,input{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
button{cursor:pointer}select{max-width:100%}input{width:90px}textarea{width:100%;height:70px;margin-top:10px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;font:12px/1.3 ui-monospace,Menlo,Consolas,monospace;color:inherit;resize:vertical}
.mut{color:var(--mut);font-size:13px}
.p{background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--bd);border-radius:14px;padding:16px;margin-top:18px}
.p.won{border-left-color:var(--ok)}.p.lost{border-left-color:var(--bad)}.p.live{border-left-color:var(--live)}.p.sched{border-left-color:var(--acc)}
.hd{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.row{display:flex;gap:8px;align-items:center}
.pp{width:42px;height:42px;border-radius:50%;font-size:18px;color:#fff;border:0;padding:0}
.pp.play{background:var(--ok)}.pp.pause{background:var(--bad)}
.nm{width:100%;font-weight:600;font-size:16px;border-color:transparent;background:transparent;padding:3px 6px}.nm:hover,.nm:focus{border-color:var(--bd);background:var(--bg)}
.p[data-locked] .ctl,.p[data-locked] .gm>.hd,.p[data-locked] .adds,.p[data-locked] [data-del]{display:none}
.p[data-locked] .nm{pointer-events:none}.p[data-locked] .gm>.gl{margin-top:0}
.gm{border-top:1px solid var(--bd);margin-top:14px;padding-top:12px}
.gl{margin:12px 0 4px}.gl b{font-size:18px}
.leg{border-top:1px solid var(--bd);padding:10px 0;margin-top:8px}
.ctl{display:flex;gap:6px;flex-wrap:wrap}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:8px}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;border:1px solid var(--bd);color:var(--mut)}
.pill.won,.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.lost{color:var(--bad);border-color:var(--bad)}
.pill.live{color:var(--live);border-color:var(--live)}.pill.sched{color:var(--acc);border-color:var(--acc)}
.trk{position:relative;height:8px;border-radius:9px;margin:16px 10px 4px;background:linear-gradient(90deg,var(--bd) var(--z),var(--zone) var(--z))}
.trk i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:rgba(128,128,128,.45)}
.trk.full{background:var(--zone)}
.dot{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%);background:var(--card);border:4px solid var(--mut);transition:left .5s}
.dot.live{border-color:var(--live)}.dot.ok,.dot.won{border-color:var(--ok)}.dot.lost{border-color:var(--bad)}.dot.sched{border-color:var(--acc)}
.tl{position:relative;height:16px;margin:0 10px;color:var(--mut);font-size:12px}.tl span{position:absolute;top:0}
.bar{height:6px;background:var(--bd);border-radius:9px;margin:7px 0 3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--live)}
.bar.won i,.bar.ok i{background:var(--ok)}.bar.lost i{background:var(--bad)}
</style></head><body><main>
<h1>NBA Parlay Tracker</h1>
<div class="mut" id="sub">Loading today’s games…</div>
<div class="row" style="margin-top:12px"><button id="addbox">+ Add parlay</button><button id="refresh">Refresh slate</button><button id="copy">Copy save code</button></div>
<textarea id="code" placeholder="Paste a save code here, then click Load code"></textarea>
<div class="row" style="margin-top:6px"><button id="load">Load code</button><span class="mut" id="cmsg"></span></div>
<div id="list"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const ESPN='https://site.api.espn.com/apis/site/v2/sports/basketball/nba/';
const MT='America/Edmonton';
const STATS={PTS:{label:'Points (PTS)',k:['PTS']},REB:{label:'Rebounds (REB)',k:['REB']},AST:{label:'Assists (AST)',k:['AST']},
  PRA:{label:'Combo: PTS+REB+AST',k:['PTS','REB','AST']},PR:{label:'Combo: PTS+REB',k:['PTS','REB']},PA:{label:'Combo: PTS+AST',k:['PTS','AST']},RA:{label:'Combo: REB+AST',k:['REB','AST']}};
let S={boxes:[]};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('pt2')||'{}'))}catch(e){}
const fixBox=b=>{if(!b.games){b.games=[{gid:b.gid||'',legs:b.legs||[]}];delete b.gid;delete b.legs}return b};
S.boxes=S.boxes.map(fixBox);
const save=()=>{try{localStorage.setItem('pt2',JSON.stringify(S))}catch(e){}};
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').trim();
const tMT=t=>new Date(t).toLocaleString('en-US',{timeZone:MT,weekday:'short',hour:'numeric',minute:'2-digit'})+' MT';
const eta=t=>{const m=Math.max(0,Math.round((t-Date.now())/6e4));return m>=60?Math.floor(m/60)+'h '+m%60+'m':m+'m'};

/* ---------- data ---------- */
const games={},rosters={};let slate=[];
function ingest(e){
  const c=e.competitions[0],g=games[e.id]||(games[e.id]={id:e.id});
  if(g.final)return;
  g.start=new Date(e.date).getTime();g.state=e.status.type.state;g.detail=e.status.type.shortDetail;g.teams={};
  c.competitors.forEach(t=>g.teams[t.homeAway]={id:t.team.id,score:+t.score||0,label:t.team.shortDisplayName||t.team.displayName});
}
function ingestSum(g,j){
  const c=j.header&&j.header.competitions&&j.header.competitions[0];
  if(c){g.state=c.status.type.state;g.detail=c.status.type.shortDetail;
    c.competitors.forEach(t=>{if(g.teams[t.homeAway])g.teams[t.homeAway].score=+t.score||0})}
  g.box=(j.boxscore&&j.boxscore.players)||g.box;
  if(g.state==='post')g.final=true;
}
async function loadSlate(){
  try{
    const d=new Intl.DateTimeFormat('en-CA',{timeZone:MT}).format(new Date()).replace(/-/g,'');
    const j=await(await fetch(`${ESPN}scoreboard?dates=${d}&limit=50`)).json();
    (j.events||[]).forEach(ingest);
    slate=(j.events||[]).map(e=>e.id).sort((a,b)=>games[a].start-games[b].start);
    $('#sub').textContent=slate.length?`${slate.length} game${slate.length>1?'s':''} today · times in Alberta Mountain Time`:'No NBA games found for today.';
    const ids=[...new Set(slate.flatMap(id=>['home','away'].map(s=>games[id].teams[s].id)))].filter(id=>!rosters[id]);
    await Promise.all(ids.map(async id=>{
      try{const j=await(await fetch(`${ESPN}teams/${id}/roster`)).json();
        rosters[id]=(j.athletes||[]).flatMap(a=>a.items||[a]).map(a=>({id:String(a.id),name:a.displayName||a.fullName})).filter(a=>a.name).sort((a,b)=>a.name.localeCompare(b.name));
      }catch(e){rosters[id]=[]}}));
  }catch(e){$('#sub').textContent='Could not load today’s games from ESPN. Check your connection and hit Refresh.'}
  render();
}

/* ---------- evaluation ---------- */
function propValue(g,l){
  if(!g.box)return null;let tot=0;const pn=norm(l.player);
  for(const lab of STATS[l.stat].k)for(const t of g.box)for(const s of t.statistics||[]){
    const i=(s.labels||[]).indexOf(lab);if(i<0)continue;
    const a=(s.athletes||[]).find(a=>String(a.athlete.id)===l.pid||norm(a.athlete.displayName)===pn);
    if(a){const v=parseFloat(String((a.stats||[])[i]).split('-')[0]);if(!isNaN(v))tot+=v}
  }
  return tot;
}
function evalLeg(b,l,g){
  const o={st:'inc',cls:'',pct:null};
  if(!l.pid||l.line==null||isNaN(l.line)){o.now='Pick a player and a line';return o}
  o.line=+l.line;o.dir=l.dir==='under'?'under':'over';o.need=`${l.player} ${l.dir==='under'?'Under':'Over'} ${l.line} ${STATS[l.stat].k.join('+')}`;
  if(!b.playing){o.st='paused';o.now='Not tracking (paused)';return o}
  if(g.state==='pre'&&g.start>Date.now()){o.st='sched';o.cls='sched';o.now='Waiting for tip-off';return o}
  const v=propValue(g,l);if(v==null){o.st='live';o.cls='live';o.now='Loading box score…';return o}
  const done=g.state==='post',line=+l.line;o.pct=line?v/line:0;o.now=`${v} of ${line}`;
  const fin=ok=>{o.st=ok?'won':'lost';o.cls=ok?'won':'lost'};
  if(l.dir==='under'){if(v>line){fin(false);if(!done)o.now+=' · busted'}else if(done)fin(true);else{o.st='live';o.cls='ok'}}
  else{if(v>line){fin(true);if(!done)o.now+=' · locked in'}else if(done)fin(false);else{o.st='live';o.cls='live'}}
  return o;
}

/* ---------- render ---------- */
function legHTML(b,gi,l,i,g){
  const grp=['away','home'].map(s=>{const t=g.teams[s];return`<optgroup label="${E(t.label)}">`+(rosters[t.id]||[]).map(p=>`<option value="${p.id}"${l.pid===p.id?' selected':''}>${E(p.name)}</option>`).join('')+'</optgroup>'}).join('');
  const at=`data-b="${b.id}" data-g="${gi}" data-i="${i}"`;
  return`<div class="leg"><div class="ctl">
<select data-f="pid" ${at}><option value="">Player…</option>${grp}</select>
<select data-f="stat" ${at}>${Object.entries(STATS).map(([k,v])=>`<option value="${k}"${l.stat===k?' selected':''}>${v.label}</option>`).join('')}</select>
<select data-f="dir" ${at}><option value="over"${l.dir!=='under'?' selected':''}>Over</option><option value="under"${l.dir==='under'?' selected':''}>Under</option></select>
<input data-f="line" ${at} type="number" step="0.5" min="0" placeholder="Line" value="${l.line??''}">
<button data-rm="${b.id}:${gi}:${i}" title="Remove">✕</button></div><div id="lv-${b.id}-${gi}-${i}"></div></div>`;
}
function gameHTML(b,G,gi){
  const g=games[G.gid];
  const opts=slate.map(id=>{const x=games[id];return`<option value="${id}"${G.gid===id?' selected':''}>${E(x.teams.away.label)} @ ${E(x.teams.home.label)} · ${tMT(x.start)}</option>`}).join('');
  const legs=g?G.legs.map((l,i)=>legHTML(b,gi,l,i,g)).join(''):'';
  return`<div class="gm"><div class="hd"><select data-game="${b.id}" data-g="${gi}"><option value="">Select a game…</option>${opts}</select>
${b.games.length>1?`<button data-rg="${b.id}:${gi}" title="Remove this game">✕</button>`:''}</div>
<div class="gl" id="gh-${b.id}-${gi}"></div>${legs}
<div class="row adds" style="margin-top:10px">${g?`<button data-add="${b.id}:${gi}">+ Add player</button>`:''}<button data-sgp="${b.id}">+ Add SGPx</button></div></div>`;
}
function boxHTML(b){
  return`<section class="p" id="b-${b.id}"${b.locked?' data-locked':''}><div class="hd"><div class="row" style="flex:1;min-width:0"><button data-col="${b.id}" id="cb-${b.id}" title="Collapse / expand">${b.collapsed?'▸':'▾'}</button>
<div style="flex:1;min-width:0"><input class="nm" data-name="${b.id}" maxlength="60" placeholder="Name this parlay" value="${E(b.name||'')}"><div class="mut" id="bt-${b.id}" style="padding-left:6px"></div></div></div>
<div class="row"><span class="pill lost" id="lp-${b.id}" hidden>LOST</span><button data-lock="${b.id}" id="lk-${b.id}">${b.locked?'Unlock':'Lock'}</button><button class="pp" data-pp="${b.id}"></button><button data-del="${b.id}" title="Delete parlay">✕</button></div></div>
<div id="bd-${b.id}"${b.collapsed?' hidden':''}>${b.games.map((G,gi)=>gameHTML(b,G,gi)).join('')}</div></section>`;
}
function render(){
  $('#list').innerHTML=S.boxes.length?S.boxes.map(boxHTML).join(''):'<p class="mut">Click “+ Add parlay” to start.</p>';
  updateLive();
}
function updateLive(){
  S.boxes.forEach(b=>{
    const box=$('#b-'+b.id);if(!box)return;
    const pp=document.querySelector(`[data-pp="${b.id}"]`);
    pp.textContent=b.playing?'⏸':'▶';pp.className='pp '+(b.playing?'pause':'play');pp.title=b.playing?'Pause tracking':'Start tracking';
    const all=[],sums=[];
    b.games.forEach((G,gi)=>{
      const gh=$(`#gh-${b.id}-${gi}`),g=games[G.gid];if(!gh)return;
      if(!g){gh.innerHTML=G.gid?'<span class="mut">That game isn’t on today’s slate.</span>':'<span class="mut">Choose a game to start.</span>';return}
      const L=G.legs.map((l,i)=>({e:evalLeg(b,l,g),i}));
      L.forEach(({e,i})=>{
        const pill=e.st==='sched'?'Scheduled':{won:'Hit',lost:'Missed',paused:'Paused',inc:'—'}[e.st]||(e.cls==='ok'?'On track':'Live');
        $(`#lv-${b.id}-${gi}-${i}`).innerHTML=`<div class="top"><b>${E(e.need||'')}</b><span class="pill ${e.cls}">${pill}</span></div>`+
          (e.line!=null?(()=>{const Z=100/1.15,pos=Math.min(100,(e.pct||0)*Z);return`<div class="trk${(e.dir==='over'&&e.st==='won')||(e.dir==='under'&&e.st==='lost')?' full':''}" style="--z:${Z}%;--zone:var(--${e.dir==='under'?'bad':'ok'})"><i style="width:${pos}%"></i><span class="dot ${e.cls}" style="left:${pos}%"></span></div><div class="tl"><span style="left:0">0</span><span style="left:${Z}%;transform:translateX(-50%)">${e.line}</span></div>`})():'')+`<div>${E(e.now)}</div>`;
      });
      all.push(...L);
      const sc=g.state==='pre'?`Starts ${tMT(g.start)} · in ${eta(g.start)}`:`${E(g.teams.away.label)} ${g.teams.away.score} – ${g.teams.home.score} ${E(g.teams.home.label)} · ${E(g.detail)}`;
      sums.push(g.state==='pre'?`${g.teams.away.label} @ ${g.teams.home.label} ${tMT(g.start)}`:`${g.teams.away.label} ${g.teams.away.score}–${g.teams.home.score} ${g.teams.home.label} ${g.detail}`);
      gh.innerHTML=`<b>${E(g.teams.away.label)} @ ${E(g.teams.home.label)}</b><div class="mut">${g.state==='pre'?'':'Tip-off '+tMT(g.start)+' · '}${sc}</div>`;
    });
    const act=all.filter(x=>x.e.st!=='inc');let st='';
    if(b.playing&&act.length){st=act.some(x=>x.e.st==='lost')?'lost':act.every(x=>x.e.st==='won')&&act.length===all.length?'won':act.every(x=>x.e.st==='sched')?'sched':'live'}
    if(st==='lost'&&!b.lost){b.lost=true;save()}
    if(b.lost)st='lost';
    const hit=all.filter(x=>x.e.st==='won').length;
    $('#bt-'+b.id).textContent=`${b.games.length} game${b.games.length>1?'s':''} · ${hit} of ${all.length} legs hit${b.playing?'':' · paused'}`+(b.collapsed&&sums.length?' · '+sums.join(' | '):'');
    $('#lp-'+b.id).hidden=!b.lost;box.className='p '+st;
  });
}

/* ---------- live polling ---------- */
async function poll(){
  const ids=new Set();
  S.boxes.forEach(b=>b.games.forEach(G=>{const g=games[G.gid];if(b.playing&&g&&g.start<=Date.now()&&!g.final)ids.add(G.gid)}));
  await Promise.all([...ids].map(async id=>{const g=games[id];try{ingestSum(g,await(await fetch(`${ESPN}summary?event=${id}`)).json())}catch(e){}}));
  updateLive();
}

/* ---------- events ---------- */
$('#addbox').onclick=()=>{S.boxes.push({id:Date.now().toString(36),name:'',collapsed:false,playing:false,lost:false,locked:false,games:[{gid:'',legs:[]}]});save();render()};
$('#refresh').onclick=loadSlate;
const BX=id=>S.boxes.find(b=>b.id===id);
$('#list').oninput=e=>{const d=e.target.dataset;if(d.name){BX(d.name).name=e.target.value;save()}};
$('#list').onclick=e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.col){const b=BX(d.col);b.collapsed=!b.collapsed;save();$('#bd-'+b.id).hidden=b.collapsed;$('#cb-'+b.id).textContent=b.collapsed?'▸':'▾';updateLive()}
  if(d.lock){const b=BX(d.lock),bx=$('#b-'+b.id);b.locked=!b.locked;save();bx.toggleAttribute('data-locked',b.locked);t.textContent=b.locked?'Unlock':'Lock';bx.querySelector('.nm').readOnly=b.locked}
  if(d.pp){const b=BX(d.pp);b.playing=!b.playing;save();updateLive();if(b.playing)poll()}
  if(d.del){S.boxes=S.boxes.filter(b=>b.id!==d.del);save();render()}
  if(d.sgp){const b=BX(d.sgp);b.lost=false;b.games.push({gid:'',legs:[]});save();render()}
  if(d.add){const[id,gi]=d.add.split(':'),b=BX(id);b.lost=false;b.games[+gi].legs.push({pid:'',player:'',stat:'PTS',dir:'over',line:null});save();render()}
  if(d.rm){const[id,gi,i]=d.rm.split(':'),b=BX(id);b.lost=false;b.games[+gi].legs.splice(+i,1);save();render()}
  if(d.rg){const[id,gi]=d.rg.split(':'),b=BX(id);b.lost=false;b.games.splice(+gi,1);save();render()}
};
$('#list').onchange=e=>{
  const t=e.target,d=t.dataset;
  if(d.game!==undefined){const b=BX(d.game);b.lost=false;b.games[+d.g]={gid:t.value,legs:[]};save();render();return}
  if(!d.f)return;
  const b=BX(d.b),l=b.games[+d.g].legs[+d.i];b.lost=false;
  if(d.f==='pid'){l.pid=t.value;l.player=t.value?t.selectedOptions[0].textContent:''}
  else if(d.f==='line')l.line=t.value===''?null:parseFloat(t.value);
  else l[d.f]=t.value;
  save();updateLive();if(b.playing)poll();
};

/* ---------- save / load code ---------- */
const cmsg=t=>$('#cmsg').textContent=t;
function makeCode(){return'PT1:'+btoa(unescape(encodeURIComponent(JSON.stringify(S.boxes))))}
$('#copy').onclick=async()=>{
  const c=makeCode();$('#code').value=c;
  try{await navigator.clipboard.writeText(c);cmsg('Code copied. Paste it anywhere to keep it.')}
  catch(e){$('#code').select();cmsg('Select and copy the code above.')}
};
$('#load').onclick=()=>{
  try{
    const c=$('#code').value.trim();if(!c.startsWith('PT1:'))throw 0;
    const a=JSON.parse(decodeURIComponent(escape(atob(c.slice(4)))));if(!Array.isArray(a))throw 0;
    if(S.boxes.length&&!confirm('Replace your current parlays with this code?'))return;
    const cl=l=>({pid:String(l.pid||''),player:String(l.player||''),stat:STATS[l.stat]?l.stat:'PTS',dir:l.dir==='under'?'under':'over',line:l.line==null||isNaN(+l.line)?null:+l.line});
    S.boxes=a.map(b=>{b=fixBox(b);return{id:String(b.id||Date.now().toString(36)+Math.random().toString(36).slice(2,5)),name:String(b.name||'').slice(0,60),collapsed:!!b.collapsed,locked:!!b.locked,playing:!!b.playing,lost:!!b.lost,
      games:(b.games.length?b.games:[{}]).map(G=>({gid:String(G.gid||''),legs:(G.legs||[]).map(cl)}))}});
    save();render();poll();cmsg('Loaded '+S.boxes.length+' parlay'+(S.boxes.length===1?'':'s')+'.');
  }catch(e){cmsg('That code isn’t valid.')}
};
loadSlate();setInterval(poll,15000);setInterval(updateLive,30000);setInterval(loadSlate,18e5);
</script></body></html>
